<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Despues del cole</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fce4e4; font-family: 'Inter', system-ui, sans-serif; }
        #renderCanvas { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center text-gray-800 pb-10">

    <div class="w-full max-w-lg bg-white/60 backdrop-blur-md p-5 sm:p-8 rounded-3xl shadow-xl border border-white/80">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-red-700 mb-2">Reporte Después del cole</h1>
            <p class="text-sm text-gray-600">Genera y envía reportes rápidamente</p>
        </div>

        <form id="reportForm" class="space-y-5">
            <h2 class="text-lg font-bold text-gray-800 border-b-2 border-red-200 pb-2">📝 Datos del Alumno</h2>

            <div>
                <label class="block text-sm font-bold text-green-800 mb-1">Nombre del Alumno/a:</label>
                <input type="text" id="alumno" required placeholder="Ej. Juan Pérez"
                    class="w-full px-4 py-3 border-2 border-red-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-200 bg-white transition-all">
            </div>

            <div>
                <label class="block text-sm font-bold text-green-800 mb-1">Proyectos avanzados:</label>
                <div class="bg-white/70 border-2 border-red-200 rounded-2xl p-3 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="kitSel" class="w-full px-3 py-2 border-2 border-red-300 rounded-xl bg-white text-sm font-bold focus:outline-none focus:ring-4 focus:ring-red-200"></select>
                        <select id="unidadSel" class="w-full px-3 py-2 border-2 border-red-300 rounded-xl bg-white text-sm font-bold focus:outline-none focus:ring-4 focus:ring-red-200"></select>
                    </div>
                    <div id="listaProyectos" class="space-y-1 max-h-52 overflow-y-auto pr-1"></div>
                    <div id="chips" class="flex flex-wrap gap-2"></div>
                </div>
                <input type="text" id="proyectos" required placeholder="Los proyectos elegidos aparecen aquí (puedes editarlo)"
                    class="w-full mt-2 px-4 py-3 border-2 border-red-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-200 bg-white transition-all">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-green-800 mb-1">Fecha:</label>
                    <input type="date" id="fecha" required
                        class="w-full px-4 py-3 border-2 border-red-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-200 bg-white transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-green-800 mb-1">Número de sesión:</label>
                    <select id="sesion" class="w-full px-4 py-3 border-2 border-red-400 rounded-xl bg-white focus:outline-none focus:ring-4 focus:ring-red-200 font-bold text-center">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-green-800 mb-1">Comentario:</label>
                <textarea id="comentario" rows="4" required placeholder="Escribe un comentario sobre el desempeño..."
                    class="w-full px-4 py-3 border-2 border-red-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-red-200 bg-white resize-none transition-all"></textarea>
            </div>

            <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-100">
                <label class="block text-sm font-bold text-blue-900 mb-2">📸 Fotos del Alumno (1 o 2):</label>
                <input type="file" id="fotoAlumno" accept="image/*" multiple required
                    class="w-full text-sm text-blue-700 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 border-2 border-dashed border-blue-300 p-3 rounded-xl bg-white">
                <p class="text-xs text-blue-700 mt-2">Selecciona 2 fotos a la vez para que salgan una encima de la otra.</p>
            </div>

            <button type="submit" id="btnGenerar"
                class="w-full mt-4 bg-gradient-to-r from-red-600 to-red-500 text-white font-black text-lg py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Generar y Enviar
            </button>
        </form>

        <canvas id="renderCanvas" width="1600" height="900"></canvas>
    </div>

        window.onload = () => {

        function loadStaticImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        function loadStudentImage(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        function roundedPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function drawRoundedRect(ctx, x, y, w, h, r, fill, stroke, lw = 6) {
            roundedPath(ctx, x, y, w, h, r);
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
        }

        // Devuelve las líneas de texto que caben en maxWidth
        // (también corta palabras larguísimas sin espacios)
        function getLines(ctx, text, maxWidth) {
            const lines = [];
            text.split('\n').forEach(par => {
                let line = '';
                par.split(' ').forEach(word => {
                    // Si la palabra sola no cabe, se corta por letras
                    while (ctx.measureText(word).width > maxWidth) {
                        if (line) { lines.push(line); line = ''; }
                        let i = 1;
                        while (i < word.length && ctx.measureText(word.slice(0, i + 1)).width <= maxWidth) i++;
                        lines.push(word.slice(0, i));
                        word = word.slice(i);
                    }
                    const test = line ? line + ' ' + word : word;
                    if (ctx.measureText(test).width > maxWidth && line) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = test;
                    }
                });
                lines.push(line);
            });
            return lines;
        }

        // Texto de una línea centrado en una caja; reduce la letra si no cabe
        function fitCenteredText(ctx, text, boxX, boxY, boxW, boxH, startSize, color) {
            let size = startSize;
            ctx.font = `${size}px ${FONT}`;
            while (ctx.measureText(text).width > boxW - 50 && size > 16) {
                size -= 2;
                ctx.font = `${size}px ${FONT}`;
            }
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, boxX + boxW / 2, boxY + boxH / 2 + 2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Texto centrado de varias líneas dentro de una caja; reduce la letra hasta que quepa
        function fitCenteredMulti(ctx, text, boxX, boxY, boxW, boxH, startSize, color) {
            let size = startSize, lines, lh;
            while (true) {
                ctx.font = `${size}px ${FONT}`;
                lines = getLines(ctx, text, boxW - 50);
                lh = size * 1.2;
                if (lines.length * lh <= boxH - 16 || size <= 12) break;
                size -= 1;
            }
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const startY = boxY + boxH / 2 - (lines.length * lh) / 2 + lh / 2;
            lines.forEach((l, i) => ctx.fillText(l, boxX + boxW / 2, startY + i * lh + 2));
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Dibuja una foto tipo "object-fit: cover" dentro de un rectángulo
        function drawCover(ctx, img, x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.clip();
            const scale = Math.max(w / img.width, h / img.height);
            const rW = img.width * scale, rH = img.height * scale;
            ctx.drawImage(img, x + (w - rW) / 2, y + (h - rH) / 2, rW, rH);
            ctx.restore();
        }

                'Ciencia en la naturaleza y en la vida cotidiana': ['Hábitats','Rediseñar para crear nuevos objetos','Polinización','Clasificar y elegir materiales','Protección frente al viento'],
                'Viajero feliz': ['Ferry fluvial','¡Taxi! ¡Taxi!','Trayecto en helicóptero','Hidrodeslizador','El teleférico','El genial autobús'],
                'Juegos disparatados para el festival': ['El superminigolf','Diversión en la bolera','Locos por el hockey','Loco laberinto','No toques el borde','Minijuego de pinball'],
                'Creaciones peculiares': ['La máquina de los buenos días','Pequeño gran asistente','El moderno parque de juegos','La supermáquina de basura','El gol decisivo','Selector aleatorio de libros'],
                'Animales y su entorno': ['Prepararse para los fenómenos meteorológicos','Ciclos vitales','Comportamiento animal','Resolver problemas cuando cambian los entornos','Animales en sus hábitats'],
                'Conexiones científicas': ['Cómo ven los ojos','Estructuras animales','Recursos energéticos','Prepararse para los peligros naturales','Transferencia de información'],
                'Ciencia que no podemos ver': ['Materia','Gravedad','El día y la noche','Proteger el medioambiente','Flujo de energía']
            },
            'LEGO SPIKE Prime': {
                'Escuadrón de los inventos': ['¡Ayuda!','Carrera de saltadores','Superlimpieza','Roto'],
                'Arranque de un negocio': ['Haz tu pedido','Fuera de servicio','Hacer un seguimiento de los paquetes','Un sitio seguro','¡Un sitio superseguro!'],
                'Invenciones caseras': ['Break dance','Repetir 5 veces','¿Lluvia o sol?','Velocidad del viento','Amor vegetariano','Juego mental'],
                'Listo para competir': ['Campamento de entrenamiento 1: ¡A conducir!','Campamento de entrenamiento 2: Jugar con objetos','Campamento de entrenamiento 3: Reaccionar ante líneas','La misión guiada: 2026-27','Montar una base de conducción avanzada','Mi código, nuestro programa','¡Hora de mejorar!','Listo para la misión'],
                'Rastreadores de entrenamiento': ['Estiramientos con datos','Cuesta arriba','Saltos en cuclillas','Paso a paso','Persigue tu objetivo']
            }
        };

        const kitSel = document.getElementById('kitSel');
        const unidadSel = document.getElementById('unidadSel');
        const listaEl = document.getElementById('listaProyectos');
        const chipsEl = document.getElementById('chips');
        const proyectosInput = document.getElementById('proyectos');
        const seleccion = []; // proyectos elegidos, en orden

        function syncInput() {
            proyectosInput.value = seleccion.join(', ');
        }

        function renderChips() {
            chipsEl.innerHTML = '';
            seleccion.forEach(nombre => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'text-xs font-bold bg-red-100 text-red-800 border border-red-300 rounded-full px-3 py-1';
                chip.textContent = nombre + '  ✕';
                chip.onclick = () => { toggleProyecto(nombre, false); };
                chipsEl.appendChild(chip);
            });
        }

        function toggleProyecto(nombre, marcado) {
            const i = seleccion.indexOf(nombre);
            if (marcado && i === -1) seleccion.push(nombre);
            if (!marcado && i !== -1) seleccion.splice(i, 1);
            syncInput();
            renderChips();
            renderProyectos();
        }

        function renderProyectos() {
            listaEl.innerHTML = '';
            const proyectos = CATALOGO[kitSel.value][unidadSel.value] || [];
            proyectos.forEach((nombre, idx) => {
                const label = document.createElement('label');
                label.className = 'flex items-start gap-2 text-sm bg-white rounded-lg px-2 py-1 border border-red-100 cursor-pointer';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'mt-1';
                cb.checked = seleccion.includes(nombre);
                cb.onchange = () => toggleProyecto(nombre, cb.checked);
                const span = document.createElement('span');
                span.textContent = `${idx + 1}. ${nombre}`;
                label.appendChild(cb);
                label.appendChild(span);
                listaEl.appendChild(label);
            });
        }

        function renderUnidades() {
            unidadSel.innerHTML = '';
            Object.keys(CATALOGO[kitSel.value]).forEach(u => {
                const o = document.createElement('option');
                o.value = u; o.textContent = u;
                unidadSel.appendChild(o);
            });
            renderProyectos();
        }

        Object.keys(CATALOGO).forEach(k => {
            const o = document.createElement('option');
            o.value = k; o.textContent = k;
            kitSel.appendChild(o);
        });
        kitSel.onchange = renderUnidades;
        unidadSel.onchange = renderProyectos;
        renderUnidades();

        const form = document.getElementById('reportForm');
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const btnGenerar = document.getElementById('btnGenerar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const originalBtnText = btnGenerar.innerHTML;
            btnGenerar.innerHTML = '⏳ Generando...';
            btnGenerar.disabled = true;

            try {
                const fotoInput = document.getElementById('fotoAlumno');
                const files = Array.from(fotoInput.files).slice(0, 2);

                const [logoImg, legoImg, ...studentImgs] = await Promise.all([
                    loadStaticImage(LOGO_SRC),
                    loadStaticImage(LEGO_SRC),
                    ...files.map(loadStudentImage)
                ]);

                const alumno = document.getElementById('alumno').value.trim();
                const proyectos = document.getElementById('proyectos').value.trim();
                const comentario = document.getElementById('comentario').value.trim();
                const fechaInput = document.getElementById('fecha').value;
                const sesion = parseInt(document.getElementById('sesion').value);

                // Fecha en palabras: "15 de octubre"
                const p = fechaInput.split('-');
                const fechaTexto = `${parseInt(p[2])} de ${MESES[parseInt(p[1]) - 1]}`;

                // 1. Fondo
                ctx.fillStyle = '#f5cccc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. Logo (arriba izquierda)
                if (logoImg) {
                    const lw = 400, lh = lw * logoImg.height / logoImg.width;
                    ctx.drawImage(logoImg, 95, 70, lw, lh);
                }

                // 3. Títulos
                const green = '#2d6a1a';
                ctx.font = `30px ${FONT}`;
                ctx.fillStyle = green;
                ctx.fillText('Alumno/a:', 112, 325);
                ctx.fillText('Nombre de los proyectos avanzados:', 112, 475);
                ctx.fillText('Comentario:', 112, 600);

                // 4. Cajas
                const red = '#cc0000';
                drawRoundedRect(ctx, 95, 345, 868, 82, 20, '#ffffff', red, 8);
                drawRoundedRect(ctx, 95, 487, 868, 82, 20, '#ffffff', red, 8);
                drawRoundedRect(ctx, 95, 622, 885, 238, 45, '#ffffff', red, 8);

                // 5. Textos (nombre y proyectos centrados)
                fitCenteredText(ctx, alumno, 95, 345, 868, 82, 36, green);
                fitCenteredMulti(ctx, proyectos, 95, 487, 868, 82, 32, green);

                // Comentario: ajusta el tamaño de letra para que quepa en la caja
                const cX = 125, cW = 885 - 60, cTop = 650, cMaxH = 238 - 56;
                let fs = 28, lines, lh;
                while (true) {
                    ctx.font = `${fs}px ${FONT}`;
                    lines = getLines(ctx, comentario, cW);
                    lh = fs * 1.32;
                    if (lines.length * lh <= cMaxH || fs <= 16) break;
                    fs -= 1;
                }
                ctx.fillStyle = green;
                ctx.textBaseline = 'top';
                lines.forEach((l, i) => ctx.fillText(l, cX, cTop + i * lh));
                ctx.textBaseline = 'alphabetic';

                // 6. Sesión y círculos (arriba derecha)
                ctx.font = `30px ${FONT}`;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`Sesión: ${fechaTexto}`, 1075, 85);

                const startX = 1112, circleY = 145, radius = 46, spacing = 108;
                for (let i = 1; i <= 4; i++) {
                    const cx = startX + (i - 1) * spacing;
                    ctx.beginPath();
                    ctx.arc(cx, circleY, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = i <= sesion ? '#fde7a3' : '#ffffff';
                    ctx.fill();
                    if (legoImg) ctx.drawImage(legoImg, cx - 31, circleY - 31, 62, 62);
                }

                // 7. Caja blanca con foto(s)
                const bx = 1040, by = 216, bw = 497, bh = 623;
                drawRoundedRect(ctx, bx, by, bw, bh, 70, '#ffffff', null);

                const pad = 28, padX = 57;
                const ix = bx + padX, iy = by + pad, iw = bw - padX * 2, ih = bh - pad * 2;
                const valid = studentImgs.filter(Boolean);

                if (valid.length === 1) {
                    drawCover(ctx, valid[0], ix, iy, iw, ih);
                } else if (valid.length >= 2) {
                    const half = ih / 2;
                    drawCover(ctx, valid[0], ix, iy, iw, half);
                    drawCover(ctx, valid[1], ix, iy + half, iw, half);
                }

                // 8. Exportar y compartir
                canvas.toBlob(async (blob) => {
                    const fileName = `Reporte_${alumno.replace(/\s+/g, '_')}.jpg`;
                    const file = new File([blob], fileName, { type: 'image/jpeg' });

                    btnGenerar.innerHTML = originalBtnText;
                    btnGenerar.disabled = false;

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Reporte Después del cole',
                                text: `Reporte de sesión de ${alumno}`
                            });
                        } catch (error) {
                            console.log('Compartir cancelado o fallido', error);
                        }
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                }, 'image/jpeg', 1.0);

            } catch (error) {
                console.error(error);
                btnGenerar.innerHTML = originalBtnText;
                btnGenerar.disabled = false;
            }
        });
    </script>
</body>
